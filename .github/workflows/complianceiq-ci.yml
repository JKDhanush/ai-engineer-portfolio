# ComplianceIQ CI: runs on every push / pull request that touches project 1.
# Fast and free: no GPU, no database, no LLM. The model-dependent evals (retrieval ablation, generation eval
# with --gate) run on the laptop before a release, because they need the GPU and the ingested corpus.
name: complianceiq-ci

on:
  push:
    paths: ["project-1-complianceiq/**", ".github/workflows/complianceiq-ci.yml"]
  pull_request:
    paths: ["project-1-complianceiq/**", ".github/workflows/complianceiq-ci.yml"]

defaults:
  run:
    working-directory: project-1-complianceiq/backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project-1-complianceiq/backend/requirements*.txt
      - name: Install dependencies (API + PDF parser + test tools; no torch)
        run: pip install -r requirements.txt pymupdf pytest ruff
      - name: Lint
        run: ruff check . ../evals
      - name: Unit tests (fast set; slow tests need the RBI PDFs)
        run: pytest -m "not slow" -q
      - name: Golden set is valid
        run: python ../evals/validate_golden.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-1-complianceiq/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project-1-complianceiq/frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build

  docker-image:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image (proves the Dockerfile still works)
        run: docker build -t complianceiq-api:ci .

  # Continuous deployment: after the checks pass on main, SSH into the EC2 server, pull and rebuild.
  # Turned on by the repository variable DEPLOY_ENABLED=true (Settings > Secrets and variables > Actions),
  # with secrets EC2_HOST (server IP) and EC2_SSH_KEY (private key of the EC2 key pair).
  deploy:
    runs-on: ubuntu-latest
    needs: [lint-and-test, frontend, docker-image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    concurrency: production          # never two deploys at once
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          ssh -i ~/.ssh/key -o StrictHostKeyChecking=accept-new ubuntu@"$HOST" '
            set -e
            cd ~/ai-engineer-portfolio && git pull --ff-only
            cd project-1-complianceiq/deploy && make up
            docker image prune -f
          '
      - name: Smoke test
        env:
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          for i in $(seq 1 30); do
            curl -fsS "https://${HOST//./-}.sslip.io/api/health" && exit 0
            sleep 10
          done
          exit 1
