# ComplianceIQ CI: runs on every push / pull request that touches project 1.
# Fast and free: no GPU, no database, no LLM. The model-dependent evals (retrieval ablation, generation eval
# with --gate) run on the laptop before a release, because they need the GPU and the ingested corpus.
name: complianceiq-ci

on:
  push:
    paths: ["project-1-complianceiq/**", ".github/workflows/complianceiq-ci.yml"]
  pull_request:
    paths: ["project-1-complianceiq/**", ".github/workflows/complianceiq-ci.yml"]

defaults:
  run:
    working-directory: project-1-complianceiq/backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project-1-complianceiq/backend/requirements*.txt
      - name: Install dependencies (API + PDF parser + test tools; no torch)
        run: pip install -r requirements.txt pymupdf pytest ruff
      - name: Lint
        run: ruff check . ../evals
      - name: Unit tests (fast set; slow tests need the RBI PDFs)
        run: pytest -m "not slow" -q
      - name: Golden set is valid
        run: python ../evals/validate_golden.py

  docker-image:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image (proves the Dockerfile still works)
        run: docker build -t complianceiq-api:ci .
